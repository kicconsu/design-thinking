name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  tests:
    name: Pruebas principales
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get

      # Ninguna prueba puede hablar con Roble: solo se admite un cliente que
      # envuelva una base falsa (RobleClient.withDatabase). Construir el
      # cliente real o RobleApiDataBase dentro de test/ rompe el CI.
      - name: Las pruebas no usan Roble real
        working-directory: .
        run: |
          if grep -rnE "RobleApiDataBase\(|RobleClient\(" app/test; then
            echo "::error::Una prueba construye un cliente real de Roble. Usa un fake en app/test/support."
            exit 1
          fi

      - name: Análisis estático
        run: flutter analyze

      # Toda la carpeta test/ (lógica y widgets): no hay lista de archivos que
      # mantener al mover o renombrar pruebas.
      - name: Unit y widget tests
        run: flutter test
