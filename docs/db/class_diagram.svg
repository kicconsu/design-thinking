.3638">BEFORE INSERT OR UPDATE (si es posible):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.8955" x="926.2646" y="861.4966">validar que el member y la task</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.4731" x="926.2646" y="876.6294">sean del mismo proyecto.</text></g><g class="entity" data-qualified-name="GMN31" data-source-line="156" id="ent0032"><path d="M377.5,652.7969 L377.5,708.1953 A0,0 0 0 0 377.5,708.1953 L669.2529,708.1953 A0,0 0 0 0 669.2529,708.1953 L669.2529,662.7969 L659.2529,652.7969 L527.5,652.7969 L523.5,507.5369 L519.5,652.7969 L377.5,652.7969 A0,0 0 0 0 377.5,652.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M659.2529,652.7969 L659.2529,662.7969 L669.2529,662.7969 L659.2529,652.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.021" x="383.5" y="669.8638">Una sola solicitud pending a la vez</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.1748" x="391.7646" y="684.9966">por cada (user_id, project_id).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.7529" x="383.5" y="700.1294">Las denied/cancelled quedan de historial.</text></g><g class="entity" data-qualified-name="GMN34" data-source-line="162" id="ent0035"><path d="M1257.5,592.2969 L1257.5,768.7578 A0,0 0 0 0 1257.5,768.7578 L1611.4092,768.7578 A0,0 0 0 0 1611.4092,768.7578 L1611.4092,602.2969 L1601.4092,592.2969 L1438.5,592.2969 L1434.5,515.4869 L1430.5,592.2969 L1257.5,592.2969 A0,0 0 0 0 1257.5,592.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1601.4092,592.2969 L1601.4092,602.2969 L1611.4092,602.2969 L1601.4092,592.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.2427" x="1263.5" y="609.3638">Cada estancia es una fila y nunca se borra ni</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.083" x="1271.7646" y="624.4966">se reabre: salir o ser echado la marca left o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.6445" x="1271.7646" y="639.6294">removed (con leftAt) y volver crea una fila nueva.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.7476" x="1271.7646" y="654.7622">Activo = fila con status active. ROBLE no</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.6548" x="1271.7646" y="669.895">garantiza unicidad: addProjectMember no inserta</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.5322" x="1271.7646" y="685.0278">si ya hay una activa.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.4775" x="1263.5" y="700.1606">Las solicitudes e invitaciones accepted son</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.9731" x="1271.7646" y="715.2935">historia; solo project_member dice quién</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="88.3467" x="1271.7646" y="730.4263">colabora hoy.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.0405" x="1263.5" y="745.5591">Pendiente: qué pasa cuando alguien se va</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111.2871" x="1263.5" y="760.6919">(status o left_at).</text></g><g class="entity" data-qualified-name="GMN37" data-source-line="176" id="ent0038"><path d="M1662,607.2969 L1662,753.4922 A0,0 0 0 0 1662,753.4922 L1955.2954,753.4922 A0,0 0 0 0 1955.2954,753.4922 L1955.2954,617.2969 L1945.2954,607.2969 L1812.5,607.2969 L1808.5,507.5369 L1804.5,607.2969 L1662,607.2969 A0,0 0 0 0 1662,607.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1945.2954,607.2969 L1945.2954,617.2969 L1955.2954,617.2969 L1945.2954,607.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.6626" x="1668" y="624.3638">El cliente verifica TODOS los correos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.0952" x="1668" y="639.4966">(consulta guardada usuario_por_correo)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.7871" x="1668" y="654.6294">ANTES de crear el proyecto.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.0981" x="1668" y="669.7622">Si alguno no tiene cuenta, no se escribe</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.2954" x="1668" y="684.895">nada: la creación se aborta por completo.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.9663" x="1668" y="700.0278">Si la inserción falla después de crear el</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.1738" x="1668" y="715.1606">proyecto, se borra el proyecto con sus</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.29" x="1668" y="730.2935">miembros e invitaciones (rollback).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.1099" x="1668" y="745.4263">Una sola pending por (project_id, email).</text></g><