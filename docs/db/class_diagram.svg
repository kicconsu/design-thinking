font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.4731" x="1743.2646" y="860.6294">sean del mismo proyecto.</text></g><g class="entity" data-qualified-name="GMN30" data-source-line="152" id="ent0031"><path d="M377.5,636.7969 L377.5,692.1953 A0,0 0 0 0 377.5,692.1953 L669.2529,692.1953 A0,0 0 0 0 669.2529,692.1953 L669.2529,646.7969 L659.2529,636.7969 L527.5,636.7969 L523.5,491.5369 L519.5,636.7969 L377.5,636.7969 A0,0 0 0 0 377.5,636.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M659.2529,636.7969 L659.2529,646.7969 L669.2529,646.7969 L659.2529,636.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.021" x="383.5" y="653.8638">Una sola solicitud pending a la vez</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.1748" x="391.7646" y="668.9966">por cada (user_id, project_id).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.7529" x="383.5" y="684.1294">Las denied/cancelled quedan de historial.</text></g><g class="entity" data-qualified-name="GMN33" data-source-line="158" id="ent0034"><path d="M1392.5,576.2969 L1392.5,752.7578 A0,0 0 0 0 1392.5,752.7578 L1746.4092,752.7578 A0,0 0 0 0 1746.4092,752.7578 L1746.4092,586.2969 L1736.4092,576.2969 L1576.55,576.2969 L1575.23,499.4869 L1568.55,576.2969 L1392.5,576.2969 A0,0 0 0 0 1392.5,576.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1736.4092,576.2969 L1736.4092,586.2969 L1746.4092,586.2969 L1736.4092,576.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.2427" x="1398.5" y="593.3638">Cada estancia es una fila y nunca se borra ni</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.083" x="1406.7646" y="608.4966">se reabre: salir o ser echado la marca left o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.6445" x="1406.7646" y="623.6294">removed (con leftAt) y volver crea una fila nueva.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.7476" x="1406.7646" y="638.7622">Activo = fila con status active. ROBLE no</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.6548" x="1406.7646" y="653.895">garantiza unicidad: addProjectMember no inserta</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.5322" x="1406.7646" y="669.0278">si ya hay una activa.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.4775" x="1398.5" y="684.1606">Las solicitudes e invitaciones accepted son</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.9731" x="1406.7646" y="699.2935">historia; solo project_member dice quién</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="88.3467" x="1406.7646" y="714.4263">colabora hoy.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.0405" x="1398.5" y="729.5591">Pendiente: qué pasa cuando alguien se va</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111.2871" x="1398.5" y="744.6919">(status o left_at).</text></g><g class="entity" data-qualified-name="GMN36" data-source-line="172" id="ent0037"><path d="M1064,591.2969 L1064,737.4922 A0,0 0 0 0 1064,737.4922 L1357.2954,737.4922 A0,0 0 0 0 1357.2954,737.4922 L1357.2954,601.2969 L1347.2954,591.2969 L1216.18,591.2969 L1214.5,491.5369 L1208.18,591.2969 L1064,591.2969 A0,0 0 0 0 1064,591.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1347.2954,591.2969 L1347.2954,601.2969 L1357.2954,601.2969 L1347.2954,591.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.6626" x="1070" y="608.3638">El cliente verifica TODOS los correos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.0952" x="1070" y="623.4966">(consulta guardada usuario_por_correo)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.7871" x="1070" y="638.6294">ANTES de crear el proyecto.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.0981" x="1070" y="653.7622">Si alguno no tiene cuenta, no se escribe</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.2954" x="1070" y="668.895">nada: la creación se aborta por completo.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.9663" x="1070" y="684.0278">Si la inserción falla después de crear el</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.1738" x="1070" y="699.1606">proyecto, se borra el proyecto con sus</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.29" x="1070" y="714.2935">miembros e invitaciones (rollback).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.1099" x="1070" y="729.4263">Una sola pending por (project_id, email).</text></g><!--link project to GMN5--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="association" data-source-line="52" id="lnk7"><path d="M1452.58,156.2269 C1575.53,180.8669 1804.12,232.9069 1987.5,310.2969 C2025.41,3